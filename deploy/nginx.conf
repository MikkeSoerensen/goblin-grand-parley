# nginx reverse proxy for the game server.
# Replace spil.example.dk with your own (sub)domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/goblin-grand-parley
#   sudo ln -s /etc/nginx/sites-available/goblin-grand-parley /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d spil.example.dk      # free HTTPS certificate
server {
    listen 80;
    server_name spil.example.dk;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # Required for Socket.io WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
